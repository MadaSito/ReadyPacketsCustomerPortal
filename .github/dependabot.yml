# Dependency update automation. Updates arrive as reviewable PRs; nothing merges automatically.
# New dependencies still require a row in docs/engineering/DEPENDENCIES.md (see docs/engineering/SDLC.md).
version: 2
updates:
  - package-ecosystem: npm # reads package.json + pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions arrive as individual PRs so each gets its own review and ADR if needed.
    ignore:
      # Type definitions must track the runtime: package.json engines pins Node >=22.13.0 <23.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Base images of the container stack are pinned by digest; these entries propose digest and tag updates.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies]
    commit-message:
      prefix: "chore(docker)"
    # The runtime stays on Node 22 and MySQL 8.4 LTS; only refreshes within those release lines are wanted.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    labels: [dependencies]
    commit-message:
      prefix: "chore(docker)"
    # The runtime stays on Node 22 and MySQL 8.4 LTS; only refreshes within those release lines are wanted.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]
