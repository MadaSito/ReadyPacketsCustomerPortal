# Security scanning. No repository secrets are used.
# TODO(pin): replace every action major tag with a confirmed full commit SHA (plus a `# vX.Y.Z` comment).
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7 # TODO(pin)
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4 # TODO(pin)
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4 # TODO(pin)
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # TODO(pin)
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5 # TODO(pin)
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  audit:
    name: pnpm audit (production, fail on high)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # TODO(pin)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # TODO(pin)
      - uses: actions/setup-node@v7 # TODO(pin)
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit production dependencies from the lockfile
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # TODO(pin)
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - name: gitleaks (full git history, redacted output)
        # Official image, exact release tag. TODO(pin): pin by image digest (@sha256:…) once confirmed.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  sbom:
    name: SBOM (CycloneDX)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # TODO(pin)
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # TODO(pin)
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate CycloneDX SBOM from pnpm-lock.yaml
        # Exact tool version; runs with read-only token and no secrets.
        run: npx --yes @cyclonedx/cdxgen@12.9.3 -t js -o sbom.cdx.json .
      - uses: actions/upload-artifact@v7 # TODO(pin)
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
