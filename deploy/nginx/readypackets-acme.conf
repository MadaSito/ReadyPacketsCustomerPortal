# Temporary HTTP-only vhost, used before issuance. Remove once the full site is enabled.
server {
    listen 80;
    listen [::]:80;
    server_name my.readypackets.com portal.readypackets.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/readypackets-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
