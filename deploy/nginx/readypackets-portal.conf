# Include in nginx http{} via sites-enabled. Dedicated nginx host, no other default vhosts.
server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:rp_tls:10m;
ssl_session_tickets off;

limit_req_zone $binary_remote_addr zone=rp_edge:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=rp_conns:10m;
# The installer uses IPv4 loopback for Nginx health checks while public traffic is fenced.
map $remote_addr $rp_maintenance_file {
    default /etc/nginx/readypackets-maintenance;
    127.0.0.1 "";
}
map $http_host $rp_http_authority_ok {
    default 0;
    ~*^(my|portal)\.readypackets\.com(:80)?$ 1;
}
map $http_host $rp_portal_authority_ok {
    default 0;
    ~*^portal\.readypackets\.com(:443)?$ 1;
}
map $http_host $rp_my_authority_ok {
    default 0;
    ~*^my\.readypackets\.com(:443)?$ 1;
}
# Never log request paths/queries, Referer, cookies, or credentials. The app logs safe route templates.
log_format rp_json escape=json '{"time":"$time_iso8601","edge_request_id":"$request_id","request_id":"$upstream_http_x_request_id","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
access_log /var/log/nginx/readypackets-access.log rp_json;
# nginx error diagnostics can embed raw request lines. Use app logs + safe access log for request diagnostics.
error_log /var/log/nginx/readypackets-error.log crit;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name my.readypackets.com portal.readypackets.com;
    if ($rp_http_authority_ok = 0) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/readypackets-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://my.readypackets.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.readypackets.com;
    if ($rp_portal_authority_ok = 0) { return 444; }
    include /etc/nginx/snippets/readypackets-tls.conf;
    # No app response here. Canonical vhost passes the application's own HSTS unchanged.
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 308 https://my.readypackets.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name my.readypackets.com;
    if ($rp_my_authority_ok = 0) { return 444; }
    include /etc/nginx/snippets/readypackets-tls.conf;

    # Root-managed sentinel persists through reboot until an operator proves the release healthy.
    if (-f $rp_maintenance_file) { return 503; }

    client_header_timeout 20s;
    client_body_timeout 30s;
    client_max_body_size 256k;
    send_timeout 60s;
    keepalive_timeout 30s;
    limit_req zone=rp_edge burst=100 nodelay;
    limit_req_status 429;
    limit_conn rp_conns 20;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host my.readypackets.com;
    # Single hop. Overwrite, never append client-supplied forwarding or tracing headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host my.readypackets.com;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header traceparent "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    # No nginx asset cache or Expires override. App publishes immutable hashed assets and revalidates
    # index.html/sw.js (authenticated responses are no-store). Never serve the private storage tree.

    location = /api/portable/imports {
        client_max_body_size 192m;
        proxy_pass http://127.0.0.1:5000;
    }
    location ^~ /api/files/upload/ {
        client_max_body_size 256m;
        proxy_pass http://127.0.0.1:5000;
    }
    location = /api/platform/presentation/images {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:5000;
    }
    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
