# ReadyPackets Customer Portal — Hardened Nginx Site Configuration
# Target profile: Single-VPS native deployment (Ubuntu 24.04 LTS / Debian 12+)
# Canonical origin: https://my.readypackets.com
# Alias redirect:   portal.readypackets.com -> 308 https://my.readypackets.com$request_uri
#
# Security & edge coordination notes (coordinated with server/http):
#  1. Single trusted hop: `RP_TRUSTED_PROXIES=127.0.0.1` in `/etc/readypackets/portal.env`.
#     Nginx overwrites `X-Forwarded-For` with `$remote_addr` (NEVER `$proxy_add_x_forwarded_for`),
#     sets `Host $host` and `X-Forwarded-Proto https`, and strips `X-Forwarded-Host`.
#  2. Single HSTS header: Nginx hides any upstream `Strict-Transport-Security` and emits exactly one
#     `Strict-Transport-Security: max-age=31536000` header WITHOUT `includeSubDomains` or `preload`
#     until the domain owner explicitly approves subdomain-wide TLS readiness across *.readypackets.com.
#  3. `/readyz` exposes operator health diagnostics and is restricted to loopback.
#  4. Authenticated and API responses are never cached or buffered to disk by Nginx.

upstream readypackets_portal_web {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Plaintext HTTP (:80) -> 308 Permanent Redirect to Canonical HTTPS Origin
server {
    listen 80;
    listen [::]:80;
    server_name my.readypackets.com portal.readypackets.com;

    server_tokens off;

    # Optional ACME HTTP-01 challenge directory
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme-challenge;
    }

    # Sensitive callbacks are canonical HTTPS only; never put their queries in a redirect.
    location ~* ^/(?:api/identity/sso/callback/?$|api/storage/oauth/callback(?:/|$)|api/(?:webhooks/inbound|payments/(?:webhooks|return))(?:/|$)) {
        return 404;
    }

    location / {
        return 308 https://my.readypackets.com$request_uri;
    }
}

# 2. HTTPS Alias Host (:443 portal.readypackets.com) -> 308 Canonical Origin
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.readypackets.com;

    server_tokens off;

    ssl_certificate           /etc/letsencrypt/live/my.readypackets.com/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/my.readypackets.com/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/my.readypackets.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:RP_TLS:10m;
    ssl_session_tickets       off;

    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout          5s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Sensitive callbacks are canonical HTTPS only; never put their queries in a redirect.
    location ~* ^/(?:api/identity/sso/callback/?$|api/storage/oauth/callback(?:/|$)|api/(?:webhooks/inbound|payments/(?:webhooks|return))(?:/|$)) {
        return 404;
    }
    location / {
        return 308 https://my.readypackets.com$request_uri;
    }
}

# 3. Canonical HTTPS Host (:443 my.readypackets.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my.readypackets.com;

    server_tokens off;

    # TLS 1.2 / 1.3 + OCSP Stapling
    ssl_certificate           /etc/letsencrypt/live/my.readypackets.com/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/my.readypackets.com/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/my.readypackets.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:RP_TLS:10m;
    ssl_session_tickets       off;

    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout          5s;

    # Single authoritative HSTS header (no includeSubDomains/preload until domain-wide sign-off)
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Request size and timeout bounds (55m permits 50 MiB file uploads; webhooks capped tighter below)
    client_max_body_size      55m;
    client_body_buffer_size   128k;
    client_body_timeout       30s;
    client_header_timeout     15s;
    keepalive_timeout         65s;
    send_timeout              30s;

    # Common single-hop trusted proxy settings
    proxy_http_version        1.1;
    proxy_set_header          Connection "";
    proxy_set_header          Host $host;
    proxy_set_header          X-Forwarded-For $remote_addr;
    proxy_set_header          X-Forwarded-Proto https;
    proxy_set_header          X-Forwarded-Host "";
    proxy_connect_timeout     5s;
    proxy_send_timeout        60s;
    proxy_read_timeout        60s;

    # Operator readiness endpoint — restricted to local loopback probes
    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://readypackets_portal_web;
    }

    # Public liveness probe (returns minimal {"ok":true})
    location = /healthz {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://readypackets_portal_web;
    }

    # Tighter 256 KiB request body ceiling on signed inbound webhooks
    location ^~ /api/integrations/webhooks/ {
        client_max_body_size 256k;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_pass http://readypackets_portal_web;
    }

    # Authenticated API, tRPC, and private streamed attachment/backup downloads — never cached or disk-buffered
    location ^~ /api/ {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
        proxy_pass http://readypackets_portal_web;
    }

    # Content-hashed immutable Vite build assets
    location ^~ /assets/ {
        proxy_pass http://readypackets_portal_web;
    }

    # Application shell & public documents — upstream controls exact Cache-Control / CSP per route
    location / {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://readypackets_portal_web;
    }
}
