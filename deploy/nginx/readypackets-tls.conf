ssl_certificate /etc/letsencrypt/live/readypackets-portal/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/readypackets-portal/privkey.pem;

# Let's Encrypt does not issue OCSP URLs. For an alternate CA with an OCSP responder:
# ssl_stapling on;
# ssl_stapling_verify on;
# ssl_trusted_certificate /etc/nginx/readypackets-ocsp-trust.pem;
# resolver 127.0.0.53 valid=300s;
# resolver_timeout 5s;
