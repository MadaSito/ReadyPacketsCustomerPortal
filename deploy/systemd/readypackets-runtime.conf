[Service]
User=readypackets
Group=readypackets
WorkingDirectory=/opt/readypackets/current
EnvironmentFile=/etc/readypackets/portal.env
EnvironmentFile=/opt/readypackets/current/release.env
Environment=PATH=/usr/local/bin:/usr/bin:/bin
LoadCredential=database_url:/etc/readypackets/secrets/database_url
LoadCredential=rp_data_keyring:/etc/readypackets/secrets/rp_data_keyring
LoadCredential=rp_index_key:/etc/readypackets/secrets/rp_index_key
LoadCredential=rp_pseudonym_key:/etc/readypackets/secrets/rp_pseudonym_key
LoadCredential=rp_token_hash_key:/etc/readypackets/secrets/rp_token_hash_key
LoadCredential=rp_audit_chain_key:/etc/readypackets/secrets/rp_audit_chain_key
Environment=DATABASE_URL_FILE=%d/database_url
Environment=RP_DATA_KEYRING_FILE=%d/rp_data_keyring
Environment=RP_INDEX_KEY_FILE=%d/rp_index_key
Environment=RP_PSEUDONYM_KEY_FILE=%d/rp_pseudonym_key
Environment=RP_TOKEN_HASH_KEY_FILE=%d/rp_token_hash_key
Environment=RP_AUDIT_CHAIN_KEY_FILE=%d/rp_audit_chain_key

UMask=0077
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
LockPersonality=yes
ReadWritePaths=/var/lib/readypackets/storage
LimitCORE=0
# MemoryDenyWriteExecute is deliberately omitted: V8 needs executable JIT memory.
KillSignal=SIGTERM
TimeoutStopSec=90s
